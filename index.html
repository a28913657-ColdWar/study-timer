<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>計時器 V2.2</title>
  <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-database-compat.js"></script>
  <style>
    *{box-sizing:border-box;font-family:"Microsoft JhengHei",Arial,sans-serif}
    body{margin:0;min-height:100vh;background:radial-gradient(circle at top left,rgba(76,111,255,.22),transparent 34%),radial-gradient(circle at bottom right,rgba(103,232,249,.12),transparent 32%),linear-gradient(135deg,#090b12,#151824 52%,#0d111a);display:flex;align-items:center;justify-content:center;color:#eef2ff;padding:24px 0}
    .app{width:min(760px,94vw);background:rgba(18,23,35,.94);border:1px solid rgba(148,163,184,.22);border-radius:28px;padding:32px;box-shadow:0 22px 60px rgba(0,0,0,.48);backdrop-filter:blur(14px)}
    h1{text-align:center;margin:0 0 16px;font-size:30px;letter-spacing:1px;color:#f8fafc}
    .cloud-status{display:flex;justify-content:center;align-items:center;gap:8px;color:#94a3b8;font-size:13px;margin-bottom:18px}
    .dot{width:9px;height:9px;border-radius:999px;background:#64748b;box-shadow:0 0 10px rgba(100,116,139,.4)}
    .dot.online{background:#22c55e;box-shadow:0 0 12px rgba(34,197,94,.6)}
    .dot.offline{background:#ef4444;box-shadow:0 0 12px rgba(239,68,68,.6)}
    .pin-panel,.item-panel,.settings,.fitness-panel{background:rgba(15,23,42,.72);border:1px solid rgba(148,163,184,.18);border-radius:18px;padding:14px;margin:0 0 18px;text-align:center}
    .pin-title,.item-title,.panel-title{font-size:17px;font-weight:800;color:#f8fafc;margin-bottom:10px}
    .pin-status{font-size:14px;color:#fca5a5;margin-bottom:10px}
    .pin-status.unlocked{color:#86efac}
    .pin-row,.item-row,.fitness-row{display:grid;gap:10px;align-items:center}
    .pin-row{grid-template-columns:1fr auto auto}
    .item-row{grid-template-columns:1fr 1fr}
    .fitness-row{grid-template-columns:1fr 1fr 1fr}
    label{display:block;font-size:14px;color:#a7b0c0;margin-bottom:6px;text-align:left}
    input,select{width:100%;padding:12px 10px;border:1px solid rgba(148,163,184,.32);border-radius:14px;font-size:18px;text-align:center;background:#0f172a;color:#f8fafc;outline:none}
    input:focus,select:focus{border-color:#60a5fa;box-shadow:0 0 0 3px rgba(96,165,250,.16)}
    input:disabled,select:disabled{background:#111827;color:#64748b}
    .settings{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
    .hint{font-size:12px;color:#94a3b8;margin-top:6px;text-align:center;line-height:1.5}
    .today-box{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:18px}
    .card{background:rgba(15,23,42,.78);border:1px solid rgba(148,163,184,.18);border-radius:18px;padding:16px;text-align:center;box-shadow:inset 0 1px 0 rgba(255,255,255,.03)}
    .card-title{color:#94a3b8;font-size:14px;margin-bottom:8px}
    .card-value{font-size:24px;font-weight:800;color:#f8fafc}
    .status{text-align:center;margin:18px 0 12px}
    .phase{display:inline-block;padding:8px 18px;border-radius:999px;background:rgba(59,130,246,.16);color:#93c5fd;border:1px solid rgba(147,197,253,.18);font-size:18px;font-weight:bold}
    .circle-wrap{display:flex;align-items:center;justify-content:center;margin:10px 0 20px}
    .progress-ring{position:relative;width:240px;height:240px}
    .progress-ring svg{width:240px;height:240px;transform:rotate(-90deg);overflow:visible}
    .circle-bg{fill:none;stroke:#0b1020;stroke-width:12}
    .circle-progress{fill:none;stroke:url(#grad1);stroke-width:12;stroke-linecap:round;stroke-dasharray:628.32;stroke-dashoffset:628.32;transition:stroke-dashoffset .35s linear;filter:drop-shadow(0 0 10px rgba(96,165,250,.35))}
    .circle-inner{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;text-align:center;pointer-events:none}
    .time{font-size:44px;line-height:1.1;font-weight:900;letter-spacing:2px;color:#fff;text-shadow:0 0 28px rgba(96,165,250,.18)}
    .percent{margin-top:8px;font-size:18px;font-weight:700;color:#93c5fd}
    .total{text-align:center;font-size:15px;color:#94a3b8;margin-bottom:22px;line-height:1.8}
    .buttons{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:14px}
    button{border:none;border-radius:18px;padding:16px;font-size:22px;font-weight:bold;cursor:pointer;transition:transform .08s ease,opacity .2s ease,filter .2s ease}
    button:hover:not(:disabled){filter:brightness(1.08)}
    button:active{transform:scale(.98)}
    button:disabled{opacity:.42;cursor:not-allowed;box-shadow:none!important}
    #startBtn{background:linear-gradient(135deg,#16a34a,#22c55e);color:#fff;box-shadow:0 10px 24px rgba(34,197,94,.18)}
    #pauseBtn{background:linear-gradient(135deg,#dc2626,#f97316);color:#fff;box-shadow:0 10px 24px rgba(248,113,113,.18)}
    .pin-row button,.small-buttons button{font-size:15px;padding:10px 14px;border-radius:12px;background:#1e293b;color:#dbeafe;border:1px solid rgba(148,163,184,.18)}
    .pin-row .unlock{background:linear-gradient(135deg,#2563eb,#3b82f6);color:#fff}
    .small-buttons{display:flex;justify-content:center;flex-wrap:wrap;gap:10px;margin-top:14px}
    .fitness-actions{display:flex;justify-content:center;flex-wrap:wrap;gap:10px;margin:0 0 14px}
    .fitness-actions button{font-size:16px;padding:12px 16px;border-radius:14px;background:#1e293b;color:#dbeafe;border:1px solid rgba(148,163,184,.18)}
    .records{margin-top:18px;border-top:1px solid rgba(148,163,184,.16);padding-top:18px}
    .records h2{font-size:20px;margin:0 0 12px;text-align:center;color:#f8fafc}
    .table-wrap{overflow-x:auto;border-radius:14px}
    table{width:100%;min-width:650px;border-collapse:collapse;border-radius:14px;font-size:15px;background:rgba(15,23,42,.72)}
    th,td{padding:12px 10px;border-bottom:1px solid rgba(148,163,184,.14);text-align:center;color:#e2e8f0;white-space:nowrap}
    th{background:#1e293b;color:#bfdbfe;font-weight:bold}
    tr:last-child td{border-bottom:none}
    .detail-btn{font-size:14px!important;padding:7px 10px!important;border-radius:10px!important;background:#334155!important;color:#e0f2fe!important}
    .footer{margin-top:18px;font-size:14px;color:#94a3b8;line-height:1.7;text-align:center}
    .hidden{display:none!important}
    @media(max-width:720px){.settings,.today-box,.pin-row,.item-row,.fitness-row{grid-template-columns:1fr}}
    @media(max-width:560px){.progress-ring{width:210px;height:210px}.progress-ring svg{width:210px;height:210px}.time{font-size:38px}.app{padding:24px}}
  </style>
</head>
<body>
  <main class="app">
    <h1>計時器 V2.2</h1>
    <div class="cloud-status"><span id="cloudDot" class="dot"></span><span id="cloudText">雲端連線中...</span></div>

    <div class="pin-panel">
      <div class="pin-title">操作保護</div>
      <div id="pinStatus" class="pin-status">目前只能查看，要操作請輸入 PIN。</div>
      <div class="pin-row">
        <input id="pinInput" type="password" inputmode="numeric" maxlength="8" placeholder="輸入 PIN" autocomplete="off" />
        <button id="unlockPinBtn" class="unlock">解鎖操作</button>
        <button id="lockPinBtn" class="lock">鎖定</button>
      </div>
      <div id="pinMsg" style="font-size:13px;color:#94a3b8;line-height:1.6;margin-top:10px;"></div>
    </div>

    <div class="item-panel">
      <div class="item-title">項目</div>
      <div class="item-row">
        <select id="itemType">
          <option value="學習">學習</option>
          <option value="健身">健身</option>
          <option value="custom">自行輸入</option>
        </select>
        <input id="customItem" type="text" placeholder="輸入項目名稱" maxlength="12" style="display:none;" />
      </div>
      <div id="itemCurrent" style="font-size:14px;color:#94a3b8;margin-top:10px;">目前項目：學習</div>
    </div>

    <section id="studySettings" class="settings">
      <div><label for="targetStudyMinutes">本次目標</label><input id="targetStudyMinutes" type="number" min="1" value="30" /></div>
      <div><label for="studyMinutes">每次目標</label><input id="studyMinutes" type="number" min="1" value="10" /></div>
      <div><label for="breakMinutes">每次休息</label><input id="breakMinutes" type="number" min="1" value="5" /></div>
    </section>

    <section id="fitnessSettings" class="fitness-panel hidden">
      <div class="panel-title">健身設定</div>
      <div class="fitness-row">
        <div>
          <label for="bodyPartSelect">部位</label>
          <select id="bodyPartSelect">
            <option value="背">背</option>
            <option value="腿">腿</option>
            <option value="胸">胸</option>
          </select>
        </div>
        <div>
          <label for="exerciseSelect">動作</label>
          <select id="exerciseSelect"></select>
        </div>
        <div>
          <label for="fitnessRestInput">休息時間</label>
          <input id="fitnessRestInput" type="text" inputmode="decimal" value="1" placeholder="例：1 或 1.3" />
          <div class="hint">例：1=1分鐘｜1.3=1分30秒｜0.3=30秒</div>
        </div>
      </div>
      <div style="margin-top:12px;">
        <input id="customExerciseInput" type="text" placeholder="手動輸入動作名稱" maxlength="20" style="display:none;" />
      </div>
    </section>

    <section class="today-box">
      <div class="card"><div class="card-title">今日日期</div><div id="todayDate" class="card-value">----</div></div>
      <div class="card"><div class="card-title">今日累計時間</div><div id="todayStudyTime" class="card-value">00:00:00</div></div>
    </section>

    <section class="status"><span id="phaseText" class="phase">尚未開始</span></section>

    <div class="circle-wrap">
      <div class="progress-ring">
        <svg viewBox="0 0 240 240" aria-hidden="true">
          <defs><linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#38bdf8"/><stop offset="100%" stop-color="#818cf8"/></linearGradient></defs>
          <circle class="circle-bg" cx="120" cy="120" r="100"></circle>
          <circle id="circleProgress" class="circle-progress" cx="120" cy="120" r="100"></circle>
        </svg>
        <div class="circle-inner"><div id="timeDisplay" class="time">10:00</div><div id="percentText" class="percent">0%</div></div>
      </div>
    </div>

    <div id="totalDisplay" class="total">本次已學習 0 分鐘 / 目標 30 分鐘</div>

    <section class="buttons">
      <button id="startBtn">開始</button>
      <button id="pauseBtn" disabled>停止</button>
    </section>

    <div id="fitnessActions" class="fitness-actions hidden">
      <button id="restToggleBtn">開始休息</button>
      <button id="finishExerciseBtn">完成此動作</button>
      <button id="finishSessionBtn">完成本次紀錄</button>
    </div>

    <div class="small-buttons">
      <button id="resetSessionBtn">清除本次紀錄</button>
      <button id="testSoundBtn">測試提醒音</button>
      <button id="forceSyncBtn">手動同步</button>
    </div>

    <section class="records">
      <h2>紀錄</h2>
      <div class="table-wrap">
        <table>
          <thead><tr><th>日期</th><th>項目</th><th>累計時間</th><th>詳細</th></tr></thead>
          <tbody id="recordBody"><tr><td colspan="4">尚無紀錄</td></tr></tbody>
        </table>
      </div>
      <div class="small-buttons">
        <button id="clearTodayBtn">清除今日紀錄</button>
        <button id="clearAllBtn">清除全部紀錄</button>
      </div>
    </section>

    <div class="footer">2026/05/01 Yu製作</div>
  </main>

  <script>
    const firebaseConfig={
      apiKey:"AIzaSyCcrSu0qfRdC8q7h_ID6se7Y6pZzhSRs9Q",
      authDomain:"study-timer-feddf.firebaseapp.com",
      databaseURL:"https://study-timer-feddf-default-rtdb.asia-southeast1.firebasedatabase.app",
      projectId:"study-timer-feddf",
      storageBucket:"study-timer-feddf.firebasestorage.app",
      messagingSenderId:"291292242112",
      appId:"1:291292242112:web:af000b67dbde713a424d25",
      measurementId:"G-R0WENMYKFY"
    };
    firebase.initializeApp(firebaseConfig);
    const db=firebase.database();
    const urlParams=new URLSearchParams(window.location.search);
    const ROOM_ID=urlParams.get("room")||"main";
    const roomRef=db.ref(`studyTimerRooms/${ROOM_ID}`);

    const CONTROL_PIN="0825";
    const CLIENT_ID=Math.random().toString(36).slice(2)+Date.now().toString(36);
    const CIRCUMFERENCE=2*Math.PI*100;

    const exerciseMap={
      "背":["槓鈴划船","機械下拉","啞鈴側飛鳥","啞鈴二頭彎舉","自行輸入"],
      "腿":["深蹲","機械抬腿","機械勾腿","機械分腿","機械夾腿","啞鈴分腿蹲","硬舉","懸垂抬腿","下腹平板支撐","自行輸入"],
      "胸":["槓鈴臥推","啞鈴上胸推舉","滑輪夾胸","機械夾胸","啞鈴過頭三頭","啞鈴肩推","自行輸入"]
    };

    const defaultData={
      version:"2.2-from-v1.6-fitness-multi-exercise-fixed",
      settings:{
        targetStudyMinutes:30,studyMinutes:10,breakMinutes:5,
        itemType:"學習",customItem:"",
        fitnessBodyPart:"背",fitnessExercise:"槓鈴划船",fitnessCustomExercise:"",fitnessRestInput:"1"
      },
      learningState:{
        status:"idle",currentPhase:"study",startedAt:null,baseElapsedSeconds:0,baseCompletedStudySeconds:0,
        remainingPhaseSeconds:600,dayBaseDate:"",dayBaseSeconds:0,updatedAt:0,updatedBy:""
      },
      fitnessSession:{
        status:"idle",key:"",date:"",bodyPart:"背",currentExercise:"",restTargetSeconds:60,
        segmentType:"action",segmentStartedAt:null,currentActionSeconds:0,currentRestSeconds:0,currentSegments:[],
        exercises:[],updatedAt:0,updatedBy:""
      },
      records:{},
      recordItems:{},
      fitnessRecords:{}
    };

    let cloudData=null,serverOffset=0,localTick=null,audioCtx=null,applyingRemote=false,settingsWriteTimer=null,pinUnlocked=sessionStorage.getItem("studyTimerPinUnlocked")==="1",restAlarmKey="";
    const $=id=>document.getElementById(id);

    const cloudDot=$("cloudDot"),cloudText=$("cloudText");
    const pinStatus=$("pinStatus"),pinInput=$("pinInput"),unlockPinBtn=$("unlockPinBtn"),lockPinBtn=$("lockPinBtn"),pinMsg=$("pinMsg");
    const itemType=$("itemType"),customItem=$("customItem"),itemCurrent=$("itemCurrent");
    const studySettings=$("studySettings"),fitnessSettings=$("fitnessSettings"),fitnessActions=$("fitnessActions");
    const targetInput=$("targetStudyMinutes"),studyInput=$("studyMinutes"),breakInput=$("breakMinutes");
    const bodyPartSelect=$("bodyPartSelect"),exerciseSelect=$("exerciseSelect"),customExerciseInput=$("customExerciseInput"),fitnessRestInput=$("fitnessRestInput");
    const todayDate=$("todayDate"),todayStudyTime=$("todayStudyTime"),phaseText=$("phaseText"),timeDisplay=$("timeDisplay"),percentText=$("percentText"),totalDisplay=$("totalDisplay"),circleProgress=$("circleProgress");
    const startBtn=$("startBtn"),pauseBtn=$("pauseBtn"),resetSessionBtn=$("resetSessionBtn"),testSoundBtn=$("testSoundBtn"),forceSyncBtn=$("forceSyncBtn"),restToggleBtn=$("restToggleBtn"),finishExerciseBtn=$("finishExerciseBtn"),finishSessionBtn=$("finishSessionBtn");
    const recordBody=$("recordBody"),clearTodayBtn=$("clearTodayBtn"),clearAllBtn=$("clearAllBtn");
    circleProgress.style.strokeDasharray=CIRCUMFERENCE;
    circleProgress.style.strokeDashoffset=CIRCUMFERENCE;

    function clone(obj){return JSON.parse(JSON.stringify(obj))}
    function nowMs(){return Date.now()+serverOffset}
    function todayKey(ts=nowMs()){let d=new Date(ts),y=d.getFullYear(),m=String(d.getMonth()+1).padStart(2,"0"),day=String(d.getDate()).padStart(2,"0");return `${y}-${m}-${day}`}
    function pad(n){return String(n).padStart(2,"0")}
    function fmtTimer(sec){sec=Math.max(0,Math.floor(sec));let m=Math.floor(sec/60),s=sec%60;return `${pad(m)}:${pad(s)}`}
    function fmtLong(sec){sec=Math.max(0,Math.floor(sec));let h=Math.floor(sec/3600),m=Math.floor((sec%3600)/60),s=sec%60;return `${pad(h)}:${pad(m)}:${pad(s)}`}
    function fmtRead(sec){sec=Math.max(0,Math.floor(sec));let h=Math.floor(sec/3600),m=Math.floor((sec%3600)/60),s=sec%60;if(h>0)return `${h} 小時 ${m} 分 ${s} 秒`;if(m>0)return `${m} 分 ${s} 秒`;return `${s} 秒`}
    function inNum(input,fallback){let v=parseInt(input.value,10);return Number.isFinite(v)&&v>0?v:fallback}
    function parseFitnessRest(value){let raw=String(value||"").trim().replace("：",":").replace("．",".");if(!raw)return 60;if(raw.includes(":")){let [m,s]=raw.split(":");return Math.max(1,(parseInt(m||"0",10)||0)*60+(parseInt(s||"0",10)||0))}if(raw.includes(".")){let [m,secText]=raw.split(".");let min=parseInt(m||"0",10)||0;secText=(secText||"").trim();let sec=secText.length===1?(parseInt(secText,10)||0)*10:(parseInt(secText.slice(0,2)||"0",10)||0);return Math.max(1,min*60+sec)}let min=parseInt(raw,10);if(!Number.isFinite(min)||min<0)min=1;return Math.max(1,min*60)}
    function currentRestSeconds(s=settings()){return parseFitnessRest(s.fitnessRestInput)}

    function settings(d=cloudData){let s=d?.settings||defaultData.settings;return{
      targetStudyMinutes:Math.max(1,parseInt(s.targetStudyMinutes||30,10)),
      studyMinutes:Math.max(1,parseInt(s.studyMinutes||10,10)),
      breakMinutes:Math.max(1,parseInt(s.breakMinutes||5,10)),
      itemType:s.itemType||"學習",
      customItem:s.customItem||"",
      fitnessBodyPart:s.fitnessBodyPart||"背",
      fitnessExercise:s.fitnessExercise||"槓鈴划船",
      fitnessCustomExercise:s.fitnessCustomExercise||"",
      fitnessRestInput:s.fitnessRestInput||"1"
    }}
    function currentItemName(d=cloudData){let s=settings(d);return s.itemType==="custom"?(s.customItem||"自行輸入"):(s.itemType||"學習")}
    function currentExerciseName(s=settings()){return s.fitnessExercise==="自行輸入"?(s.fitnessCustomExercise||"自行輸入"):s.fitnessExercise}

    function computeLearning(d=cloudData,t=nowMs()){
      if(!d)d=clone(defaultData);let s=settings(d),st=d.learningState||defaultData.learningState,status=st.status||"idle";
      let target=s.targetStudyMinutes*60,study=s.studyMinutes*60,br=s.breakMinutes*60;
      let elapsed=Math.max(0,st.baseElapsedSeconds||0);
      if(status==="running"&&st.startedAt)elapsed+=Math.max(0,Math.floor((t-st.startedAt)/1000));
      if(status==="idle")return{status,effectiveElapsed:0,completedStudy:0,target,currentPhase:"study",remainingPhase:Math.min(study,target),finished:false,percent:0};
      if(status==="paused")return{status,effectiveElapsed:elapsed,completedStudy:Math.min(target,st.baseCompletedStudySeconds||0),target,currentPhase:st.currentPhase||"study",remainingPhase:Math.max(0,st.remainingPhaseSeconds||0),finished:false,percent:target?Math.min(100,(st.baseCompletedStudySeconds||0)/target*100):0};
      if(status==="finished")return{status,effectiveElapsed:elapsed,completedStudy:target,target,currentPhase:"study",remainingPhase:0,finished:true,percent:100};
      let rem=elapsed,completed=0,phase="study",remaining=Math.min(study,target),finished=false;
      while(true){let studyRound=Math.min(study,target-completed);if(rem<studyRound){phase="study";completed+=rem;remaining=studyRound-rem;break}rem-=studyRound;completed+=studyRound;if(completed>=target){phase="study";remaining=0;finished=true;break}if(rem<br){phase="break";remaining=br-rem;break}rem-=br}
      completed=Math.min(target,Math.max(0,Math.floor(completed)));remaining=Math.max(0,Math.ceil(remaining));
      return{status,effectiveElapsed:elapsed,completedStudy:completed,target,currentPhase:phase,remainingPhase:remaining,finished,percent:target?Math.min(100,completed/target*100):0}
    }

    function sumExercises(exercises=[]){return exercises.reduce((sum,e)=>sum+(e.totalSeconds||0),0)}
    function sumAction(exercises=[]){return exercises.reduce((sum,e)=>sum+(e.actionSeconds||0),0)}
    function sumRest(exercises=[]){return exercises.reduce((sum,e)=>sum+(e.restSeconds||0),0)}

    function computeFitness(d=cloudData,t=nowMs()){
      let fs=d?.fitnessSession||defaultData.fitnessSession;
      let status=fs.status||"idle";
      let live=0;
      if(status==="running"&&fs.segmentStartedAt)live=Math.max(0,Math.floor((t-fs.segmentStartedAt)/1000));
      let currentAction=fs.currentActionSeconds||0,currentRest=fs.currentRestSeconds||0;
      if(status==="running"){
        if(fs.segmentType==="rest")currentRest+=live;
        else currentAction+=live;
      }
      let completedTotal=sumExercises(fs.exercises||[]);
      let total=completedTotal+currentAction+currentRest;
      let restTarget=fs.restTargetSeconds||60;
      let restLive=(status==="running"&&fs.segmentType==="rest")?live:0;
      let restRemaining=Math.max(0,restTarget-restLive);
      return{status,segmentType:fs.segmentType||"action",currentActionSeconds:currentAction,currentRestSeconds:currentRest,actionSeconds:sumAction(fs.exercises||[])+currentAction,restSeconds:sumRest(fs.exercises||[])+currentRest,totalSeconds:total,restTargetSeconds:restTarget,restRemaining,liveSeconds:live}
    }

    function todayTotal(d=cloudData){
      if(!d)return 0;let today=todayKey(),total=0;
      Object.entries(d.records||{}).forEach(([date,sec])=>{if(date===today)total+=sec||0});
      Object.values(d.fitnessRecords||{}).forEach(r=>{if(r&&r.date===today)total+=r.totalSeconds||0});
      let s=settings(d);
      if(s.itemType==="健身"){let f=computeFitness(d),fs=d.fitnessSession||{};if(["running","paused","selecting"].includes(f.status)&&fs.date===today)total+=f.totalSeconds}

    function finalizeFitnessSegment(d,now=nowMs()){
      let fs=d.fitnessSession||{},live=0;
      if(fs.status==="running"&&fs.segmentStartedAt)live=Math.max(0,Math.floor((now-fs.segmentStartedAt)/1000));
      let action=fs.currentActionSeconds||0,rest=fs.currentRestSeconds||0,segs=[...(fs.currentSegments||[])];
      if(live>0){
        if(fs.segmentType==="rest"){rest+=live;segs.push({type:"rest",seconds:live})}

      }
      return{actionSeconds:action,restSeconds:rest,segments:segs}
    }

    db.ref(".info/serverTimeOffset").on("value",snap=>{serverOffset=snap.val()||0});
    db.ref(".info/connected").on("value",snap=>updateCloudStatus(!!snap.val()));
    roomRef.on("value",snap=>{let data=snap.val()||clone(defaultData);if(data.state&&!data.learningState){data.learningState=data.state}cloudData=data;render()},err=>{cloudDot.className="dot offline";cloudText.textContent="Firebase 讀取失敗，請檢查規則";console.error(err)});

    unlockPinBtn.addEventListener("click",unlockPin);
    lockPinBtn.addEventListener("click",lockPin);
    pinInput.addEventListener("keydown",e=>{if(e.key==="Enter")unlockPin()});
    startBtn.addEventListener("click",startOrResume);
    pauseBtn.addEventListener("click",pauseTimer);
    resetSessionBtn.addEventListener("click",resetSession);
    restToggleBtn.addEventListener("click",toggleRest);
    finishExerciseBtn.addEventListener("click",finishCurrentExercise);
    finishSessionBtn.addEventListener("click",finishFitness);
    testSoundBtn.addEventListener("click",()=>playAlarm("finish"));
    forceSyncBtn.addEventListener("click",render);
    clearTodayBtn.addEventListener("click",clearToday);
    clearAllBtn.addEventListener("click",clearAll);

    [targetInput,studyInput,breakInput,itemType,customItem,bodyPartSelect,exerciseSelect,customExerciseInput,fitnessRestInput].forEach(el=>{
      el.addEventListener("input",writeSettings);
      el.addEventListener("change",()=>{
        if(el===itemType){
          if(itemType.value==="健身"){
            studySettings.classList.add("hidden");fitnessSettings.classList.remove("hidden");fitnessActions.classList.remove("hidden");
          }else{
            studySettings.classList.remove("hidden");fitnessSettings.classList.add("hidden");fitnessActions.classList.add("hidden");
          }
        }
        if(el===bodyPartSelect){let temp=settings();temp.fitnessBodyPart=bodyPartSelect.value;renderExerciseOptions(temp)}
        if(el===exerciseSelect)customExerciseInput.style.display=exerciseSelect.value==="自行輸入"?"block":"none";
        writeSettings()
      })
    });

    updatePinUI();
    init();
    localTick=setInterval(render,1000);
  </script>
</body>
</html>
